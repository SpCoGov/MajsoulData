name: Data Update

on:
  schedule:
    # Runs at 0 minutes past the hour, every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force data regeneration even when the remote version is unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "data-update"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASSET_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Install protocol documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python main.py --asset-mode all
          else
            python main.py --asset-mode all --skip-if-current
          fi

      - name: Validate generated data
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q main.py src tests
          python - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for root in (Path("data"), Path("raw")):
              for path in root.rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  count += 1
          print(f"json ok: {count}")

          assets = json.loads(Path("assets/manifest.json").read_text(encoding="utf-8"))
          assert assets["Texture2D"] > 0
          assert assets["Sprite"] > 0
          assert "AudioClip" in assets
          print(f"unity assets ok: {assets}")
          PY
          files=$(find data/protocol/proto -maxdepth 1 -name '*.proto' -printf '%f\n' | sort)
          protoc --proto_path=data/protocol/proto --descriptor_set_out=/tmp/majsoul_protocol.desc $files

      - name: Commit and push changes
        id: commit_changes
        run: |
          git lfs install --local
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ raw/ assets/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy and rename majsoul_protocol.desc
        run: cp /tmp/majsoul_protocol.desc ./liqi.desc

      - name: Generate liqi.proto
        run: python desc_to_proto.py liqi.desc liqi.proto --package lq

      - name: Get release version
        id: release_version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          docs_version = json.loads(
              Path("data/client/docs_version/version.json").read_text()
          )["version"]
          product_version = json.loads(Path("data/meta.json").read_text())[
              "product_version"
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={docs_version}-{product_version}\n")
          PY

      - name: Get latest release
        id: get_latest_release
        uses: joutvhu/get-release@v1
        with:
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload release
        uses: softprops/action-gh-release@v3
        if: |
          steps.get_latest_release.outcome == 'failure' ||
          steps.get_latest_release.outputs.tag_name != steps.release_version.outputs.version
        with:
          tag_name: ${{ steps.release_version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Release ${{ steps.release_version.outputs.version }}
            Auto-generated liqi.desc and liqi.proto files.
          make_latest: true
          files: |
            liqi.desc
            liqi.proto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
